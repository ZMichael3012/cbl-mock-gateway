name: cbl-mock-gateway
services:

  mock-gateway:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8120"
      METRICS_ADDR: ":9320"
      WEBHOOK_TARGET_URL: http://host.docker.internal:8060/hooks/mock/ep1
      WEBHOOK_SECRET: mock-secret
      WEBHOOK_SIGNATURE_HEADER: X-Billing-Signature
      WEBHOOK_EVENT_ID_HEADER: X-Event-Id
    ports:
      - "8120:8120"
      - "9320:9320"
    networks: [cbl-net]

networks:
  cbl-net:
    driver: bridge
